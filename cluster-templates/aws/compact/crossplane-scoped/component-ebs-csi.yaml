# CredentialsRequest aws-ebs-csi-driver-operator -> openshift-cluster-csi-drivers/ebs-cloud-credentials (delivered by Hive manifestsSecretRef).
apiVersion: iam.aws.upbound.io/v1beta1
kind: User
metadata:
  name: cluster-placeholder-ebs-csi
  namespace: cluster-placeholder
spec:
  forProvider:
    tags:
      Purpose: OpenShift-ebs-csi
      CreatedBy: Crossplane
      Product: OpenShift
      openshiftpartnerlabs.com/cluster: cluster-placeholder
  providerConfigRef:
    name: default
---
# Placeholder denies everything; the cluster overlay replaces it with the scoped policy.
apiVersion: iam.aws.upbound.io/v1beta1
kind: Policy
metadata:
  name: cluster-placeholder-ebs-csi-policy
  namespace: cluster-placeholder
spec:
  forProvider:
    description: "OpenShift-ebs-csi (cluster-scoped)"
    policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Deny","Action":"*","Resource":"*"}]}'
    tags:
      Purpose: OpenShift-ebs-csi
      CreatedBy: Crossplane
      Product: OpenShift
      openshiftpartnerlabs.com/cluster: cluster-placeholder
  providerConfigRef:
    name: default
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: UserPolicyAttachment
metadata:
  name: cluster-placeholder-ebs-csi-attachment
  namespace: cluster-placeholder
spec:
  forProvider:
    policyArnRef:
      name: cluster-placeholder-ebs-csi-policy
    userRef:
      name: cluster-placeholder-ebs-csi
  providerConfigRef:
    name: default
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: AccessKey
metadata:
  name: cluster-placeholder-ebs-csi-access-key
  namespace: cluster-placeholder
spec:
  forProvider:
    userRef:
      name: cluster-placeholder-ebs-csi
  providerConfigRef:
    name: default
  writeConnectionSecretToRef:
    name: cluster-placeholder-ebs-csi-credentials-raw
    namespace: cluster-placeholder
