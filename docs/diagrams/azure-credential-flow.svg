<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 958" width="840" height="958" role="img" aria-labelledby="title desc">
  <title id="title">Azure credential flow</title>
  <desc id="desc">Crossplane creates five managed resources for a cluster: ResourceGroup &lt;name&gt;-rg, Application &lt;name&gt;-ocp-installer, Principal, Password &lt;name&gt;-client-secret, and RoleAssignments, which are created paused. The Principal references the Application through clientIdRef. The Password references the Application through applicationIdRef and writes the connection secret azure-credentials-raw. In Tekton step 1 the pipeline sets the RoleAssignment principalId to the Principal objectId and removes the crossplane.io/paused annotation. In Tekton step 2 the pipeline builds Secret azure-credentials with key osServicePrincipal.json from azure-credentials-raw. The Hive ClusterDeployment uses azure-credentials. The overlays are not ready for partner clusters: the installer credentials reach the spoke.</desc>

  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .frame { fill: #f6f8fa; stroke: #d0d7de; }
    .t { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { fill: #59636e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .c { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 24px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 650; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .b { font-size: 12px; }
    .s { font-size: 11px; }
    .k { font-weight: 650; }

    .src  { fill: #e6f6f4; stroke: #1f8f84; }
    .gate { fill: #fff4e0; stroke: #c27c0e; }
    .core { fill: #ecf2ff; stroke: #3b6fd8; }
    .out  { fill: #f3ecff; stroke: #7a4fd6; }
    .store{ fill: #eaf7ec; stroke: #2e8b46; }
    .deny { fill: #fdecec; stroke: #d1242f; }
    .user { fill: #f6f8fa; stroke: #6e7781; }

    /* badge fills are darker than card strokes so the white digit reaches 4.5:1 */
    .badge-src  { fill: #1c8278; }
    .badge-gate { fill: #a3680c; }
    .badge-core { fill: #3b6fd8; }
    .badge-out  { fill: #7a4fd6; }
    .badge-store{ fill: #2c8543; }
    .badge-t    { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }

    .flow  { stroke: #57606a; stroke-width: 1.8; fill: none; }
    .ctl   { stroke: #6e7781; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .link  { stroke: #6e7781; stroke-width: 1.6; fill: none; }
    .rule  { stroke: #d0d7de; stroke-width: 1; }
    .ah-flow { fill: #57606a; }
    .ah-ctl  { fill: #6e7781; }
    .x { stroke: #d1242f; stroke-width: 2; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .frame { fill: #151b23; stroke: #30363d; }
      .t, .c { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .src  { fill: #0f2a28; stroke: #3fb8a9; }
      .gate { fill: #2e2310; stroke: #e3a33b; }
      .core { fill: #14213d; stroke: #6d9bff; }
      .out  { fill: #251a40; stroke: #a888ff; }
      .store{ fill: #112a19; stroke: #4cc06a; }
      .deny { fill: #3a1417; stroke: #ff6b6b; }
      .user { fill: #161b22; stroke: #6e7681; }
      .badge-src  { fill: #3fb8a9; }
      .badge-gate { fill: #e3a33b; }
      .badge-core { fill: #6d9bff; }
      .badge-out  { fill: #a888ff; }
      .badge-store{ fill: #4cc06a; }
      .badge-t    { fill: #0d1117; }
      .flow  { stroke: #8b949e; }
      .ctl   { stroke: #768390; }
      .link  { stroke: #768390; }
      .rule  { stroke: #30363d; }
      .ah-flow { fill: #8b949e; }
      .ah-ctl  { fill: #768390; }
      .x { stroke: #ff6b6b; }
    }
  </style>

  <defs>
    <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-flow" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ctl" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Canvas -->
  <rect class="bg" x="0.5" y="0.5" width="839" height="957" rx="16"/>

  <!-- Title -->
  <text class="t h1" x="40" y="46">Azure credential flow</text>
  <text class="m b" x="40" y="68">Crossplane resources and Secrets that carry the installer service principal to the Hive ClusterDeployment.</text>

  <!-- ===== Constraints panel ===== -->
  <text class="m lbl" x="40" y="90">CONSTRAINTS</text>
  <rect class="frame" x="40" y="98" width="760" height="188" rx="12"/>
  <rect class="deny" x="56" y="112" width="728" height="30" rx="8" stroke-dasharray="6 4"/>
  <circle cx="74" cy="127" r="8" fill="none" class="x"/>
  <line x1="68.5" y1="132.5" x2="79.5" y2="121.5" class="x"/>
  <text class="t h2" x="92" y="132">Not ready for partner clusters: the installer credentials reach the spoke</text>

  <text class="t b k" x="56" y="174">Crossplane creates</text>
  <text class="m b" x="208" y="174">ResourceGroup · Application · Principal · Password · RoleAssignments</text>
  <line class="rule" x1="56" y1="188" x2="784" y2="188"/>
  <text class="t b k" x="56" y="206">Tekton step 1</text>
  <text class="m b" x="208" y="206">sets RoleAssignment principalId to the Principal objectId</text>
  <text class="m b" x="208" y="224">and removes the crossplane.io/paused annotation</text>
  <line class="rule" x1="56" y1="238" x2="784" y2="238"/>
  <text class="t b k" x="56" y="256">Tekton step 2</text>
  <text class="m b" x="208" y="256">builds Secret azure-credentials with key osServicePrincipal.json</text>

  <!-- ===== Credential flow ===== -->
  <text class="m lbl" x="40" y="322">CREDENTIAL FLOW</text>

  <!-- 1 Application -->
  <rect class="core" x="312" y="330" width="216" height="84" rx="12"/>
  <circle class="badge-core" cx="330" cy="350" r="10"/><text class="badge-t" x="330" y="354" text-anchor="middle">1</text>
  <text class="t h2" x="346" y="355">Application</text>
  <line class="rule" x1="324" y1="370" x2="516" y2="370"/>
  <text class="c s" x="324" y="392">&lt;name&gt;-ocp-installer</text>

  <!-- 2 ResourceGroup -->
  <rect class="core" x="584" y="330" width="216" height="84" rx="12"/>
  <circle class="badge-core" cx="602" cy="350" r="10"/><text class="badge-t" x="602" y="354" text-anchor="middle">2</text>
  <text class="t h2" x="618" y="355">ResourceGroup</text>
  <line class="rule" x1="596" y1="370" x2="788" y2="370"/>
  <text class="c s" x="596" y="392">&lt;name&gt;-rg</text>

  <!-- 3 Principal -->
  <rect class="core" x="40" y="470" width="216" height="84" rx="12"/>
  <circle class="badge-core" cx="58" cy="490" r="10"/><text class="badge-t" x="58" y="494" text-anchor="middle">3</text>
  <text class="t h2" x="74" y="495">Principal</text>
  <line class="rule" x1="52" y1="510" x2="244" y2="510"/>
  <text class="m s" x="52" y="532">references the Application</text>

  <!-- 4 Password -->
  <rect class="core" x="312" y="470" width="216" height="84" rx="12"/>
  <circle class="badge-core" cx="330" cy="490" r="10"/><text class="badge-t" x="330" y="494" text-anchor="middle">4</text>
  <text class="t h2" x="346" y="495">Password</text>
  <line class="rule" x1="324" y1="510" x2="516" y2="510"/>
  <text class="c s" x="324" y="532">&lt;name&gt;-client-secret</text>

  <!-- 5 RoleAssignments -->
  <rect class="core" x="40" y="610" width="216" height="84" rx="12"/>
  <circle class="badge-core" cx="58" cy="630" r="10"/><text class="badge-t" x="58" y="634" text-anchor="middle">5</text>
  <text class="t h2" x="74" y="635">RoleAssignments</text>
  <line class="rule" x1="52" y1="650" x2="244" y2="650"/>
  <text class="m s" x="52" y="672">paused until Tekton step 1</text>

  <!-- 6 azure-credentials-raw -->
  <rect class="store" x="312" y="610" width="216" height="84" rx="12"/>
  <circle class="badge-store" cx="330" cy="630" r="10"/><text class="badge-t" x="330" y="634" text-anchor="middle">6</text>
  <text class="t h2" x="346" y="635">azure-credentials-raw</text>
  <line class="rule" x1="324" y1="650" x2="516" y2="650"/>
  <text class="m s" x="324" y="672">connection secret of the Password</text>

  <!-- 7 azure-credentials -->
  <rect class="store" x="584" y="610" width="216" height="84" rx="12"/>
  <circle class="badge-store" cx="602" cy="630" r="10"/><text class="badge-t" x="602" y="634" text-anchor="middle">7</text>
  <text class="t h2" x="618" y="635">azure-credentials</text>
  <line class="rule" x1="596" y1="650" x2="788" y2="650"/>
  <text class="c s" x="596" y="672">osServicePrincipal.json</text>

  <!-- 8 Hive ClusterDeployment -->
  <rect class="out" x="584" y="750" width="216" height="84" rx="12"/>
  <circle class="badge-out" cx="602" cy="770" r="10"/><text class="badge-t" x="602" y="774" text-anchor="middle">8</text>
  <text class="t h2" x="618" y="775">Hive ClusterDeployment</text>
  <line class="rule" x1="596" y1="790" x2="788" y2="790"/>
  <text class="m s" x="596" y="812">uses azure-credentials</text>

  <!-- Application → Principal, Password -->
  <path class="flow" d="M366 414 V442 H148 V468" marker-end="url(#a-flow)"/>
  <text class="m s" x="156" y="460">clientIdRef</text>
  <path class="flow" d="M420 414 V468" marker-end="url(#a-flow)"/>
  <text class="m s" x="428" y="445">applicationIdRef</text>

  <!-- Principal → RoleAssignments -->
  <path class="ctl" d="M148 554 V608" marker-end="url(#a-ctl)"/>
  <text class="m s" x="156" y="585">objectId (Tekton)</text>

  <!-- Password → azure-credentials-raw → azure-credentials → ClusterDeployment -->
  <path class="flow" d="M420 554 V608" marker-end="url(#a-flow)"/>
  <text class="m s" x="428" y="585">connection secret</text>
  <path class="flow" d="M528 652 H582" marker-end="url(#a-flow)"/>
  <text class="m s" x="539" y="644">Tekton</text>
  <path class="flow" d="M692 694 V748" marker-end="url(#a-flow)"/>

  <!-- ===== Legend ===== -->
  <line class="rule" x1="40" y1="864" x2="800" y2="864"/>
  <path class="flow" d="M40 892 H76" marker-end="url(#a-flow)"/>
  <text class="m s" x="86" y="896">reference or data path</text>
  <path class="ctl" d="M246 892 H282" marker-end="url(#a-ctl)"/>
  <text class="m s" x="292" y="896">value copied by Tekton</text>
  <rect class="core" x="40" y="912" width="22" height="16" rx="4"/>
  <text class="m s" x="70" y="924">Crossplane managed resource</text>
  <rect class="store" x="252" y="912" width="22" height="16" rx="4"/>
  <text class="m s" x="282" y="924">Secret</text>
  <rect class="out" x="346" y="912" width="22" height="16" rx="4"/>
  <text class="m s" x="376" y="924">Hive resource</text>
  <rect class="deny" x="480" y="912" width="22" height="16" rx="4" stroke-dasharray="4 3"/>
  <text class="m s" x="510" y="924">not ready</text>
</svg>
