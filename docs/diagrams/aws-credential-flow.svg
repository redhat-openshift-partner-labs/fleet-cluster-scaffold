<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1220" width="840" height="1220" role="img" aria-labelledby="title desc">
  <title id="title">AWS scoped credential flow</title>
  <desc id="desc">On the hub cluster, Crossplane creates the IAM identities of one cluster: the installer user &lt;name&gt;-ocp-installer, six operator users &lt;name&gt;-&lt;operator&gt; (machine-api, cco-iam-ro, image-registry, ingress, cncc, ebs-csi), and the node roles &lt;name&gt;-master-role and &lt;name&gt;-worker-role. The installer AccessKey writes the Secret aws-credentials-raw, which is grouped with the Secret aws-credentials as the installer Secrets. The operator AccessKeys write the operator key Secrets &lt;name&gt;-&lt;operator&gt;-credentials-raw. In pipeline step 2 the pipeline builds the manifests Secret &lt;name&gt;-cloud-credentials-manifests with one Secret manifest per operator. The Hive ClusterDeployment reads aws-credentials through credentialsSecretRef and the manifests Secret through manifestsSecretRef. The Hive install creates the operator Secrets on the spoke cluster, one per operator in its target namespace. The spoke nodes use the node roles through install-config iamRole. Cluster names must be unique in their first 21 characters. Isolation rule: no credential on a spoke may act on another cluster's resources. credentialsMode is Manual, so the installer key is never copied to the spoke. In pipeline step 3, after install, the pipeline sets INFRA_ID_PLACEHOLDER and VPC_ID_PLACEHOLDER in the cluster's Policies and Roles.</desc>

  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .frame { fill: #f6f8fa; stroke: #d0d7de; }
    .t { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m { fill: #59636e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .c { fill: #1f2328; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 24px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 650; }
    .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    .b { font-size: 12px; }
    .s { font-size: 11px; }
    .k { font-weight: 650; }

    .src  { fill: #e6f6f4; stroke: #1f8f84; }
    .gate { fill: #fff4e0; stroke: #c27c0e; }
    .core { fill: #ecf2ff; stroke: #3b6fd8; }
    .out  { fill: #f3ecff; stroke: #7a4fd6; }
    .store{ fill: #eaf7ec; stroke: #2e8b46; }
    .deny { fill: #fdecec; stroke: #d1242f; }
    .user { fill: #f6f8fa; stroke: #6e7781; }

    /* badge fills are darker than card strokes so the white digit reaches 4.5:1 */
    .badge-src  { fill: #1c8278; }
    .badge-gate { fill: #a3680c; }
    .badge-core { fill: #3b6fd8; }
    .badge-out  { fill: #7a4fd6; }
    .badge-store{ fill: #2c8543; }
    .badge-t    { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }

    .flow  { stroke: #57606a; stroke-width: 1.8; fill: none; }
    .ctl   { stroke: #6e7781; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .link  { stroke: #6e7781; stroke-width: 1.6; fill: none; }
    .rule  { stroke: #d0d7de; stroke-width: 1; }
    .ah-flow { fill: #57606a; }
    .ah-ctl  { fill: #6e7781; }
    .x { stroke: #d1242f; stroke-width: 2; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .frame { fill: #151b23; stroke: #30363d; }
      .t, .c { fill: #e6edf3; }
      .m { fill: #9198a1; }
      .src  { fill: #0f2a28; stroke: #3fb8a9; }
      .gate { fill: #2e2310; stroke: #e3a33b; }
      .core { fill: #14213d; stroke: #6d9bff; }
      .out  { fill: #251a40; stroke: #a888ff; }
      .store{ fill: #112a19; stroke: #4cc06a; }
      .deny { fill: #3a1417; stroke: #ff6b6b; }
      .user { fill: #161b22; stroke: #6e7681; }
      .badge-src  { fill: #3fb8a9; }
      .badge-gate { fill: #e3a33b; }
      .badge-core { fill: #6d9bff; }
      .badge-out  { fill: #a888ff; }
      .badge-store{ fill: #4cc06a; }
      .badge-t    { fill: #0d1117; }
      .flow  { stroke: #8b949e; }
      .ctl   { stroke: #768390; }
      .link  { stroke: #768390; }
      .rule  { stroke: #30363d; }
      .ah-flow { fill: #8b949e; }
      .ah-ctl  { fill: #768390; }
      .x { stroke: #ff6b6b; }
    }
  </style>

  <defs>
    <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-flow" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-ctl" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <!-- Canvas -->
  <rect class="bg" x="0.5" y="0.5" width="839" height="1219" rx="16"/>

  <!-- Title -->
  <text class="t h1" x="40" y="46">AWS scoped credential flow</text>
  <text class="m b" x="40" y="68">IAM identities that Crossplane creates for one cluster, and the Secrets that carry their keys to Hive and the spoke.</text>

  <!-- ===== Constraints panel ===== -->
  <text class="m lbl" x="40" y="90">CONSTRAINTS</text>
  <rect class="frame" x="40" y="98" width="760" height="220" rx="12"/>
  <rect class="deny" x="56" y="112" width="728" height="30" rx="8" stroke-dasharray="6 4"/>
  <circle cx="74" cy="127" r="8" fill="none" class="x"/>
  <line x1="68.5" y1="132.5" x2="79.5" y2="121.5" class="x"/>
  <text class="t h2" x="92" y="132">Cluster names must be unique in their first 21 characters</text>

  <text class="t b k" x="56" y="174">Isolation rule</text>
  <text class="m b" x="192" y="174">no credential on a spoke may act on another cluster's resources</text>
  <line class="rule" x1="56" y1="188" x2="784" y2="188"/>
  <text class="t b k" x="56" y="206">Installer key</text>
  <text class="m b" x="192" y="206">credentialsMode Manual: the installer key is never copied to the spoke</text>
  <line class="rule" x1="56" y1="220" x2="784" y2="220"/>
  <text class="t b k" x="56" y="238">Pipeline step 2</text>
  <text class="m b" x="192" y="238">builds the manifests Secret with one Secret manifest per operator</text>
  <line class="rule" x1="56" y1="252" x2="784" y2="252"/>
  <text class="t b k" x="56" y="270">Pipeline step 3</text>
  <text class="m b" x="192" y="270">after install, sets INFRA_ID_PLACEHOLDER and VPC_ID_PLACEHOLDER</text>
  <text class="m b" x="192" y="288">in the cluster's Policies and Roles</text>

  <!-- ===== Hub cluster frame ===== -->
  <rect class="frame" x="24" y="362" width="792" height="584" rx="14"/>
  <rect class="bg" x="40" y="352" width="114" height="20" rx="10"/>
  <text class="m lbl" x="52" y="366">HUB CLUSTER</text>

  <!-- ===== Spoke cluster frame ===== -->
  <rect class="frame" x="24" y="990" width="792" height="134" rx="14"/>
  <rect class="bg" x="40" y="980" width="132" height="20" rx="10"/>
  <text class="m lbl" x="52" y="994">SPOKE CLUSTER</text>
  <text class="m s" x="612" y="1052">control plane and worker</text>
  <text class="m s" x="612" y="1066">nodes use the node roles</text>

  <!-- 1 Installer user -->
  <rect class="core" x="40" y="388" width="240" height="120" rx="12"/>
  <circle class="badge-core" cx="58" cy="408" r="10"/><text class="badge-t" x="58" y="412" text-anchor="middle">1</text>
  <text class="t h2" x="74" y="413">Installer user</text>
  <line class="rule" x1="52" y1="428" x2="268" y2="428"/>
  <text class="c s" x="52" y="450">&lt;name&gt;-ocp-installer</text>
  <text class="m s" x="52" y="490">key stays on the hub</text>

  <!-- 2 Operator users -->
  <rect class="core" x="308" y="388" width="264" height="120" rx="12"/>
  <circle class="badge-core" cx="326" cy="408" r="10"/><text class="badge-t" x="326" y="412" text-anchor="middle">2</text>
  <text class="t h2" x="342" y="413">6 operator users</text>
  <line class="rule" x1="320" y1="428" x2="560" y2="428"/>
  <text class="c s" x="320" y="450">&lt;name&gt;-&lt;operator&gt;</text>
  <text class="m s" x="320" y="468">machine-api · cco-iam-ro · image-registry</text>
  <text class="m s" x="320" y="486">ingress · cncc · ebs-csi</text>

  <!-- 3 Node roles -->
  <rect class="core" x="600" y="388" width="200" height="120" rx="12"/>
  <circle class="badge-core" cx="618" cy="408" r="10"/><text class="badge-t" x="618" y="412" text-anchor="middle">3</text>
  <text class="t h2" x="634" y="413">Node roles</text>
  <line class="rule" x1="612" y1="428" x2="788" y2="428"/>
  <text class="c s" x="612" y="450">&lt;name&gt;-master-role</text>
  <text class="c s" x="612" y="468">&lt;name&gt;-worker-role</text>
  <text class="m s" x="612" y="490">install-config iamRole</text>

  <!-- 4 Installer Secrets -->
  <rect class="store" x="40" y="556" width="240" height="102" rx="12"/>
  <circle class="badge-store" cx="58" cy="576" r="10"/><text class="badge-t" x="58" y="580" text-anchor="middle">4</text>
  <text class="t h2" x="74" y="581">Installer Secrets</text>
  <line class="rule" x1="52" y1="596" x2="268" y2="596"/>
  <text class="c s" x="52" y="618">aws-credentials-raw</text>
  <text class="c s" x="52" y="636">aws-credentials</text>

  <!-- 5 Operator key Secrets -->
  <rect class="store" x="308" y="556" width="264" height="102" rx="12"/>
  <circle class="badge-store" cx="326" cy="576" r="10"/><text class="badge-t" x="326" y="580" text-anchor="middle">5</text>
  <text class="t h2" x="342" y="581">Operator key Secrets</text>
  <line class="rule" x1="320" y1="596" x2="560" y2="596"/>
  <text class="c s" x="320" y="618">&lt;name&gt;-&lt;operator&gt;-credentials-raw</text>
  <text class="m s" x="320" y="640">one per operator user</text>

  <!-- 6 Manifests Secret -->
  <rect class="store" x="308" y="706" width="264" height="84" rx="12"/>
  <circle class="badge-store" cx="326" cy="726" r="10"/><text class="badge-t" x="326" y="730" text-anchor="middle">6</text>
  <text class="t h2" x="342" y="731">Manifests Secret</text>
  <line class="rule" x1="320" y1="746" x2="560" y2="746"/>
  <text class="c s" x="320" y="768">&lt;name&gt;-cloud-credentials-manifests</text>

  <!-- 7 Hive ClusterDeployment -->
  <rect class="out" x="308" y="838" width="264" height="84" rx="12"/>
  <circle class="badge-out" cx="326" cy="858" r="10"/><text class="badge-t" x="326" y="862" text-anchor="middle">7</text>
  <text class="t h2" x="342" y="863">Hive ClusterDeployment</text>
  <line class="rule" x1="320" y1="878" x2="560" y2="878"/>
  <text class="m s" x="320" y="900">reads both Secrets for the install</text>

  <!-- 8 Operator Secrets -->
  <rect class="store" x="308" y="1016" width="264" height="84" rx="12"/>
  <circle class="badge-store" cx="326" cy="1036" r="10"/><text class="badge-t" x="326" y="1040" text-anchor="middle">8</text>
  <text class="t h2" x="342" y="1041">Operator Secrets</text>
  <line class="rule" x1="320" y1="1056" x2="560" y2="1056"/>
  <text class="m s" x="320" y="1078">one per operator, in its target namespace</text>

  <!-- Installer user → installer Secrets → ClusterDeployment -->
  <path class="flow" d="M160 508 V554" marker-end="url(#a-flow)"/>
  <text class="m s" x="168" y="535">AccessKey</text>
  <path class="flow" d="M160 658 V814 H386 V836" marker-end="url(#a-flow)"/>
  <text class="m s" x="168" y="740">credentialsSecretRef</text>

  <!-- Operator users → key Secrets → manifests Secret → ClusterDeployment -->
  <path class="flow" d="M440 508 V554" marker-end="url(#a-flow)"/>
  <text class="m s" x="448" y="535">AccessKeys</text>
  <path class="flow" d="M440 658 V704" marker-end="url(#a-flow)"/>
  <text class="m s" x="448" y="685">pipeline step 2</text>
  <path class="flow" d="M440 790 V836" marker-end="url(#a-flow)"/>
  <text class="m s" x="448" y="817">manifestsSecretRef</text>

  <!-- ClusterDeployment → operator Secrets on the spoke -->
  <path class="flow" d="M440 922 V1014" marker-end="url(#a-flow)"/>
  <text class="m s" x="448" y="972">Hive install</text>

  <!-- Node roles → spoke cluster frame -->
  <path class="flow" d="M700 508 V988" marker-end="url(#a-flow)"/>
  <text class="m s" x="708" y="535">iamRole</text>

  <!-- ===== Legend ===== -->
  <line class="rule" x1="40" y1="1154" x2="800" y2="1154"/>
  <path class="flow" d="M40 1182 H76" marker-end="url(#a-flow)"/>
  <text class="m s" x="86" y="1186">reference or data path</text>
  <rect class="core" x="240" y="1174" width="22" height="16" rx="4"/>
  <text class="m s" x="270" y="1186">Crossplane managed resource</text>
  <rect class="store" x="452" y="1174" width="22" height="16" rx="4"/>
  <text class="m s" x="482" y="1186">Secret</text>
  <rect class="out" x="546" y="1174" width="22" height="16" rx="4"/>
  <text class="m s" x="576" y="1186">Hive resource</text>
  <rect class="deny" x="680" y="1174" width="22" height="16" rx="4" stroke-dasharray="4 3"/>
  <text class="m s" x="710" y="1186">requirement</text>
</svg>
