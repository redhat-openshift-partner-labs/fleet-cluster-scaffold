# CredentialsRequest openshift-machine-api-aws -> openshift-machine-api/aws-cloud-credentials (delivered by Hive manifestsSecretRef).
apiVersion: iam.aws.upbound.io/v1beta1
kind: User
metadata:
  name: cluster-placeholder-machine-api
  namespace: cluster-placeholder
spec:
  forProvider:
    tags:
      Purpose: OpenShift-machine-api
      CreatedBy: Crossplane
      Product: OpenShift
      openshiftpartnerlabs.com/cluster: cluster-placeholder
  providerConfigRef:
    name: default
---
# Placeholder denies everything; the cluster overlay replaces it with the scoped policy.
apiVersion: iam.aws.upbound.io/v1beta1
kind: Policy
metadata:
  name: cluster-placeholder-machine-api-policy
  namespace: cluster-placeholder
spec:
  forProvider:
    description: "OpenShift-machine-api (cluster-scoped)"
    policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Deny","Action":"*","Resource":"*"}]}'
    tags:
      Purpose: OpenShift-machine-api
      CreatedBy: Crossplane
      Product: OpenShift
      openshiftpartnerlabs.com/cluster: cluster-placeholder
  providerConfigRef:
    name: default
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: UserPolicyAttachment
metadata:
  name: cluster-placeholder-machine-api-attachment
  namespace: cluster-placeholder
spec:
  forProvider:
    policyArnRef:
      name: cluster-placeholder-machine-api-policy
    userRef:
      name: cluster-placeholder-machine-api
  providerConfigRef:
    name: default
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: AccessKey
metadata:
  name: cluster-placeholder-machine-api-access-key
  namespace: cluster-placeholder
spec:
  forProvider:
    userRef:
      name: cluster-placeholder-machine-api
  providerConfigRef:
    name: default
  writeConnectionSecretToRef:
    name: cluster-placeholder-machine-api-credentials-raw
    namespace: cluster-placeholder
