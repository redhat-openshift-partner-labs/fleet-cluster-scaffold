# Writes the client secret to azure-credentials-raw (key: attribute.value).
# The fleet Tekton pipeline builds azure-credentials/osServicePrincipal.json from it plus
# clientId (Application status.atProvider.clientId), tenantId, and subscriptionId.
apiVersion: applications.azuread.upbound.io/v1beta1
kind: Password
metadata:
  name: cluster-placeholder-client-secret
  namespace: cluster-placeholder
spec:
  forProvider:
    applicationIdRef:
      name: cluster-placeholder-ocp-installer
  providerConfigRef:
    name: default
  writeConnectionSecretToRef:
    name: azure-credentials-raw
    namespace: cluster-placeholder
