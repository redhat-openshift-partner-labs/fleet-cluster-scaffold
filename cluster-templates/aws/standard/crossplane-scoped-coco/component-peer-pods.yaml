# Peer pods (cloud-api-adaptor) -> openshift-sandboxed-containers-operator/peer-pods-secret (delivered by the fleet pipeline post-provision).
apiVersion: iam.aws.upbound.io/v1beta1
kind: User
metadata:
  name: cluster-placeholder-peer-pods
  namespace: cluster-placeholder
spec:
  forProvider:
    tags:
      Purpose: OpenShift-peer-pods
      CreatedBy: Crossplane
      Product: OpenShift
      openshiftpartnerlabs.com/cluster: cluster-placeholder
  providerConfigRef:
    name: default
---
# Placeholder denies everything; the cluster overlay replaces it with the scoped policy.
apiVersion: iam.aws.upbound.io/v1beta1
kind: Policy
metadata:
  name: cluster-placeholder-peer-pods-policy
  namespace: cluster-placeholder
spec:
  forProvider:
    description: "OpenShift-peer-pods (cluster-scoped)"
    policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Deny","Action":"*","Resource":"*"}]}'
    tags:
      Purpose: OpenShift-peer-pods
      CreatedBy: Crossplane
      Product: OpenShift
      openshiftpartnerlabs.com/cluster: cluster-placeholder
  providerConfigRef:
    name: default
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: UserPolicyAttachment
metadata:
  name: cluster-placeholder-peer-pods-attachment
  namespace: cluster-placeholder
spec:
  forProvider:
    policyArnRef:
      name: cluster-placeholder-peer-pods-policy
    userRef:
      name: cluster-placeholder-peer-pods
  providerConfigRef:
    name: default
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: AccessKey
metadata:
  name: cluster-placeholder-peer-pods-access-key
  namespace: cluster-placeholder
spec:
  forProvider:
    userRef:
      name: cluster-placeholder-peer-pods
  providerConfigRef:
    name: default
  writeConnectionSecretToRef:
    name: cluster-placeholder-peer-pods-credentials-raw
    namespace: cluster-placeholder
