# ec2 ImportSnapshot service role for the cluster's pod VM image; the fleet pipeline passes it during post-provision.
# Placeholder inline policy denies everything; the cluster overlay replaces it with the import role policy.
apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  name: cluster-placeholder-vmimport-role
  namespace: cluster-placeholder
spec:
  forProvider:
    assumeRolePolicy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"vmie.amazonaws.com"},"Action":"sts:AssumeRole","Condition":{"StringEquals":{"sts:Externalid":"vmimport"}}}]}'
    inlinePolicy:
      - name: cluster-placeholder-vmimport-policy
        policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Deny","Action":"*","Resource":"*"}]}'
    tags:
      Purpose: OpenShift-PodVM-Image-Import
      CreatedBy: Crossplane
      Product: OpenShift
      openshiftpartnerlabs.com/cluster: cluster-placeholder
  providerConfigRef:
    name: default
